[project]
name = "prj-1-kursach"
version = "0.1.0"
description = ""
authors = [
    {name = "Rodion Ventslovsky",email = "vents_23@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv (>=1.1.1,<2.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "requests (>=2.32.5,<3.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
black = "^25.9.0"
isort = "^7.0.0"


[tool.poetry.group.dev.dependencies]
mypy = "^1.18.2"
pytest = "^8.4.2"


[tool.black]
# Базовая конфигурация Black
line-length = 119
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
# Файлы и папки которые Black будет игнорировать
/(
  # git
  | \.git
  # CI
  | \.github
  # venv
  | venv
  | \.venv
  # config
  | config
  | logs
)/
'''


[tool.isort]
profile = "black"
multi_line_output = 3
# line_length = 119  # ← Синхронизировать с Black
known_first_party = ["src"]


[tool.mypy]
# Строгость типизации
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
# Дополнительные проверки
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_configs = true
# Исключения
exclude = [
    "venv",
    "\\.venv",
    "__pycache__",
    "\\.mypy_cache",
    "build",
    "dist"
]
# Настройки для конкретных модулей
[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "numpy.*",
    "matplotlib.*",
    "seaborn.*"
]
ignore_missing_imports = true